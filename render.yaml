databases:
  - name: hcm-db
    plan: free
    databaseName: hcm
services:
  - type: web
    name: hcm-lite-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: hcm-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY          # paste in Render dashboard; never commit
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS        # set to your frontend URL(s), comma separated
        value: "*"
      - key: APP_TZ
        value: Asia/Karachi
